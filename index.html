<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Castle Defense</title>
<style>


<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

    
body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87ceeb;
}
canvas{
    display:block;
}
#ui{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    background:rgba(255,255,255,.9);
    padding:10px;
    border-radius:10px;
}
button{
    padding:8px 12px;
    margin-right:5px;
    cursor:pointer;
}
</style>
</head>
<body>

<div id="ui">
    <button id="buyArcher">Buy Archer (50)</button>

    <span id="goldDisplay">Gold: 0</span>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const enemies=[];
const blood=[];
const ragdolls=[];
const arrows=[];
const archers=[];
const effects=[];

let score=0;
let gold=0;
let dragging=null;

let lastMouseX=0;
let lastMouseY=0;
let throwVX=0;
let throwVY=0;

const MAX_ARCHERS=5;

const castle={
    x:0,
    y:0,
    w:160,
    h:220,
    hp:100
};

function resize(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;

    castle.x=canvas.width-220;
    castle.y=canvas.height-270;

    updateArcherPositions();
}

window.addEventListener("resize",resize);

function updateArcherPositions(){

    const left=20;
    const width=castle.w-40;

    for(let i=0;i<archers.length;i++){

        let x;

        if(archers.length===1){
            x=castle.x+castle.w/2;
        }else{
            x=castle.x+left+
                width*(i/(archers.length-1));
        }

        archers[i].x=x;
        archers[i].y=castle.y-10;
    }
}

resize();

function spawnEnemy(){

    enemies.push({
        x:-50,
        y:canvas.height-80,

        vx:1+Math.random()*1.5,
        vy:0,

        rotation:0,
        rotationSpeed:0,
        grabbed:false
    });
}

setInterval(spawnEnemy,1200);

function createDeath(enemy){

    for(let i=0;i<20;i++){

        blood.push({
            x:enemy.x,
            y:enemy.y-20,
            vx:(Math.random()-.5)*12,
            vy:-Math.random()*8,
            size:2+Math.random()*4,
            life:60
        });
    }

    for(let i=0;i<6;i++){

        ragdolls.push({
            x:enemy.x,
            y:enemy.y-20,
            vx:(Math.random()-.5)*10,
            vy:-Math.random()*6,
            size:4+Math.random()*8,
            rotation:Math.random()*360,
            spin:(Math.random()-.5)*15,
            life:240
        });
    }
}

function levelUpArcher(a){

    a.level++;
    a.damage+=2;

    a.fireRate=Math.max(
        60,
        a.fireRate-2
    );

    effects.push({
        type:"text",
        x:a.x,
        y:a.y-40,
        life:60
    });

    effects.push({
        type:"ring",
        x:a.x,
        y:a.y-15,
        radius:10,
        life:30
    });

    for(let i=0;i<15;i++){

        effects.push({
            type:"particle",
            x:a.x,
            y:a.y-20,
            vx:(Math.random()-.5)*6,
            vy:(Math.random()-.5)*6,
            size:2+Math.random()*3,
            life:50
        });
    }
}

function awardKill(owner){

    score++;
    gold+=10;

    if(owner){

        owner.xp++;

        if(owner.xp>=owner.level*5){

            owner.xp=0;
            levelUpArcher(owner);
        }
    }
}

document.getElementById("buyArcher").onclick=()=>{

    if(gold<50) return;
    if(archers.length>=MAX_ARCHERS) return;

    gold-=50;

    archers.push({
        x:0,
        y:0,
        level:1,
        xp:0,
        damage:2,
        fireRate:120,
        cooldown:0
    });

    updateArcherPositions();
};



canvas.addEventListener("touchstart", e => {
    const touch = e.touches[0];

    lastMouseX = touch.clientX;
    lastMouseY = touch.clientY;

    for (const enemy of enemies) {
        const dx = touch.clientX - enemy.x;
        const dy = touch.clientY - (enemy.y - 40);

        if (Math.sqrt(dx * dx + dy * dy) < 40) {
            dragging = enemy;
            enemy.grabbed = true;
            break;
        }
    }
});

canvas.addEventListener("touchmove", e => {
    if (!dragging) return;

    const touch = e.touches[0];

    throwVX = touch.clientX - lastMouseX;
    throwVY = touch.clientY - lastMouseY;

    dragging.x += (touch.clientX - dragging.x) * 0.35;
    dragging.y += (touch.clientY - dragging.y) * 0.35;

    lastMouseX = touch.clientX;
    lastMouseY = touch.clientY;

    e.preventDefault();
}, { passive:false });

canvas.addEventListener("touchend", () => {
    if (!dragging) return;

    dragging.grabbed = false;
    dragging.vx = throwVX * 1.4;
    dragging.vy = throwVY * 1.1;
    dragging.rotationSpeed = (Math.random() - 0.5) * 10;

    dragging = null;
});

function update(){

    const ground=canvas.height-80;

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        if(!e.grabbed){

            e.vy+=1.2;

            e.x+=e.vx;
            e.y+=e.vy;

            e.rotation+=e.rotationSpeed;

            e.vx*=0.97;
            e.vy*=0.99;

            e.rotationSpeed*=0.98;

            if(
                Math.abs(e.vx)>6 ||
                Math.abs(e.vy)>6
            ){

                for(let j=enemies.length-1;j>=0;j--){

                    if(i===j) continue;

                    const other=enemies[j];

                    const dx=e.x-other.x;
                    const dy=e.y-other.y;

                    if(Math.sqrt(dx*dx+dy*dy)<30){

                        createDeath(other);
                        enemies.splice(j,1);
                        awardKill();
                    }
                }
            }

            if(e.y>=ground){

                if(
                    Math.abs(e.vy)>6 ||
                    Math.abs(e.vx)>8
                ){

                    createDeath(e);
                    enemies.splice(i,1);
                    awardKill();
                    continue;
                }

                e.y=ground;
                e.vy=0;

                if(Math.abs(e.vx)<1){
                    e.vx=1.5;
                }
            }
        }

        if(e.x>castle.x){

            castle.hp-=5;
            enemies.splice(i,1);
        }
    }

    archers.forEach(a=>{

        if(a.cooldown>0){
            a.cooldown--;
            return;
        }

        let target=null;
        let best=999999;

        enemies.forEach(e=>{

            let d=Math.abs(a.x-e.x);

            if(d<best){
                best=d;
                target=e;
            }
        });

        if(target){

            let dx=target.x-a.x;
            let dy=target.y-a.y;

            let len=Math.sqrt(dx*dx+dy*dy);

            arrows.push({
                x:a.x,
                y:a.y,
                vx:(dx/len)*8,
                vy:(dy/len)*8,
                owner:a
            });

            a.cooldown=a.fireRate;
        }
    });

    for(let i=arrows.length-1;i>=0;i--){

        const ar=arrows[i];

        ar.x+=ar.vx;
        ar.y+=ar.vy;

        let hit=false;

        for(let j=enemies.length-1;j>=0;j--){

            const e=enemies[j];

            const dx=ar.x-e.x;
            const dy=ar.y-(e.y-20);

            if(Math.sqrt(dx*dx+dy*dy)<18){

                createDeath(e);
                enemies.splice(j,1);

                awardKill(ar.owner);

                hit=true;
                break;
            }
        }

        if(
            hit ||
            ar.x<0 ||
            ar.x>canvas.width
        ){
            arrows.splice(i,1);
        }
    }

    blood.forEach(b=>{

        b.vy+=0.2;
        b.x+=b.vx;
        b.y+=b.vy;
        b.life--;
    });

    for(let i=blood.length-1;i>=0;i--){
        if(blood[i].life<=0)
            blood.splice(i,1);
    }

    ragdolls.forEach(r=>{

        r.vy+=0.3;

        r.x+=r.vx;
        r.y+=r.vy;

        r.rotation+=r.spin;

        if(r.y>ground){
            r.y=ground;
        }

        r.life--;
    });

    for(let i=ragdolls.length-1;i>=0;i--){
        if(ragdolls[i].life<=0)
            ragdolls.splice(i,1);
    }

    for(let i=effects.length-1;i>=0;i--){

        const e=effects[i];

        if(e.type==="particle"){
            e.x+=e.vx;
            e.y+=e.vy;
        }

        if(e.type==="text"){
            e.y-=1;
        }

        if(e.type==="ring"){
            e.radius+=2;
        }

        e.life--;

        if(e.life<=0){
            effects.splice(i,1);
        }
    }

    document.getElementById(
        "goldDisplay"
    ).textContent=`Gold: ${gold}`;

    document.getElementById(
        "buyArcher"
    ).textContent=
        `Buy Archer (50) ${archers.length}/5`;
}

function drawStickman(e){

    ctx.save();

    ctx.translate(e.x,e.y-20);
    ctx.rotate(e.rotation*Math.PI/180);

    ctx.strokeStyle="black";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(0,-20,12,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(0,-8);
    ctx.lineTo(0,28);

    ctx.moveTo(-12,5);
    ctx.lineTo(12,5);

    ctx.moveTo(0,28);
    ctx.lineTo(-10,48);

    ctx.moveTo(0,28);
    ctx.lineTo(10,48);

    ctx.stroke();

    ctx.restore();
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#87ceeb";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="#59ad45";
    ctx.fillRect(
        0,
        canvas.height-50,
        canvas.width,
        50
    );

    ctx.fillStyle="#777";
    ctx.fillRect(
        castle.x,
        castle.y,
        castle.w,
        castle.h
    );

    blood.forEach(b=>{

        ctx.fillStyle="#aa0000";

        ctx.beginPath();
        ctx.arc(
            b.x,b.y,b.size,0,Math.PI*2
        );
        ctx.fill();
    });

    ragdolls.forEach(r=>{

        ctx.save();

        ctx.translate(r.x,r.y);
        ctx.rotate(r.rotation*Math.PI/180);

        ctx.fillStyle="#111";
        ctx.fillRect(
            -r.size/2,
            -r.size/2,
            r.size,
            r.size
        );

        ctx.restore();
    });

    effects.forEach(e=>{

        if(e.type==="particle"){

            ctx.fillStyle="gold";

            ctx.beginPath();
            ctx.arc(
                e.x,e.y,e.size,0,Math.PI*2
            );
            ctx.fill();
        }

        if(e.type==="text"){

            ctx.fillStyle="yellow";
            ctx.font="18px Arial";
            ctx.fillText(
                "LEVEL UP!",
                e.x-40,
                e.y
            );
        }

        if(e.type==="ring"){

            ctx.strokeStyle="gold";

            ctx.beginPath();
            ctx.arc(
                e.x,e.y,
                e.radius,
                0,
                Math.PI*2
            );
            ctx.stroke();
        }
    });

    archers.forEach(a=>{

        if(a.level>=10){
            ctx.fillStyle="gold";
        }else if(a.level>=5){
            ctx.fillStyle="silver";
        }else{
            ctx.fillStyle="brown";
        }

        ctx.fillRect(
            a.x-5,
            a.y-20,
            10,
            20
        );

        ctx.fillStyle="yellow";
        ctx.font="12px Arial";

        ctx.fillText(
            "Lv"+a.level,
            a.x-10,
            a.y-30
        );
    });

    arrows.forEach(ar=>{

        ctx.strokeStyle="black";

        ctx.beginPath();
        ctx.moveTo(ar.x,ar.y);
        ctx.lineTo(
            ar.x-ar.vx*2,
            ar.y-ar.vy*2
        );
        ctx.stroke();
    });

    enemies.forEach(drawStickman);

    ctx.fillStyle="black";
    ctx.font="24px Arial";

    ctx.fillText("Castle HP: "+castle.hp,20,90);
    ctx.fillText("Kills: "+score,20,120);

    if(castle.hp<=0){

        ctx.fillStyle="rgba(0,0,0,.7)";
        ctx.fillRect(
            0,0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle="white";
        ctx.font="70px Arial";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2-200,
            canvas.height/2
        );
    }
}

function gameLoop(){

    if(castle.hp>0){
        update();
    }

    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
